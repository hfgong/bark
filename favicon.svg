<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Warm Dog Gradient -->
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Accent Cool Cat Gradient -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sound Wave Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Plate (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle Acoustic Ambient Grid Circles -->
  <circle cx="256" cy="265" r="190" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="2"/>
  <circle cx="256" cy="265" r="140" fill="none" stroke="rgba(245, 158, 11, 0.08)" stroke-width="2"/>

  <!-- Group for Pets & Waves -->
  <g transform="translate(4, -6)">
    <!-- Dog Silhouette (Left / Center) -->
    <path d="M150 340 C140 280, 160 210, 205 180 C215 150, 195 110, 175 95 C220 95, 245 130, 255 165 C285 160, 315 175, 330 195 C310 200, 290 215, 280 235 C305 240, 335 235, 355 225 C345 250, 320 270, 290 275 C275 305, 270 340, 270 365 C240 375, 190 375, 150 340 Z" 
          fill="url(#dogGrad)" opacity="0.95"/>
    
    <!-- Dog Eye & Snout Details -->
    <circle cx="230" cy="180" r="7" fill="#0f172a"/>
    <path d="M330 205 C335 200, 345 205, 340 212 Z" fill="#0f172a"/>

    <!-- Cat Silhouette Overlay (Right / Stylized) -->
    <path d="M260 375 C265 310, 290 260, 330 240 C340 205, 335 150, 315 135 C345 145, 365 175, 370 205 C390 190, 420 195, 435 210 C420 220, 400 225, 385 240 C400 245, 415 245, 425 240 C415 260, 395 275, 375 285 C360 320, 360 355, 350 375 Z" 
          fill="url(#catGrad)" opacity="0.88"/>
    
    <!-- Cat Eye & Whisker Accents -->
    <ellipse cx="360" cy="225" rx="5" ry="7" fill="#0f172a" transform="rotate(15 360 225)"/>
    <path d="M380 245 L415 242 M380 252 L418 258" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>

    <!-- Sound Emitting Acoustic Waves (Right Side) -->
    <path d="M400 160 A 130 130 0 0 1 450 280" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M430 130 A 180 180 0 0 1 490 300" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Bottom Brand Ribbon Badge -->
  <rect x="156" y="415" width="200" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <text x="256" y="443" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="800" letter-spacing="3" text-anchor="middle">BARK</text>
</svg>
